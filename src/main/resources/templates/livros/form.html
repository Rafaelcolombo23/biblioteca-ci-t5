<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${livro.id == null ? 'Novo Livro' : 'Editar Livro'}"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        form { max-width: 560px; display: grid; gap: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #b00020; font-size: 0.9rem; }
        .actions { display: flex; gap: 8px; }
        button, a { padding: 8px 12px; border: 1px solid #666; background: #fff; text-decoration: none; color: #111; }
    </style>
</head>
<body>
<h1 th:text="${livro.id == null ? 'Novo Livro' : 'Editar Livro'}"></h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">
    <input type="hidden" th:field="*{id}">

    <div>
        <label for="titulo">Título</label>
        <input id="titulo" type="text" th:field="*{titulo}">
        <div class="error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
    </div>

    <div>
        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}">
        <div class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
    </div>

    <div>
        <label for="anoPublicacao">Ano de publicação</label>
        <input id="anoPublicacao" type="number" th:field="*{anoPublicacao}">
        <div class="error" th:if="${#fields.hasErrors('anoPublicacao')}" th:errors="*{anoPublicacao}"></div>
    </div>

    <div>
        <label for="autor">Autor</label>
        <select id="autor" th:field="*{autor.id}">
            <option value="">Selecione um autor</option>
            <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome}"></option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></div>
        <div class="error" th:if="${#fields.hasErrors('autor.id')}" th:errors="*{autor.id}"></div>
    </div>

    <div class="actions">
        <button type="submit">Salvar</button>
        <a th:href="@{/livros}">Cancelar</a>
    </div>
</form>
</body>
</html>
